# After a push to main, hits Vercel’s deploy hook (GET).
# Add repository secret VERCEL_DEPLOY_HOOK_URL from Vercel → Project → Settings → Git → Deploy Hooks.

name: Deploy Web

on:
  push:
    branches: [main]

jobs:
  vercel-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set — skip (configure in GitHub repo secrets)."
            exit 0
          fi
          curl -fsS "$VERCEL_DEPLOY_HOOK_URL"
